<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHO — Image Similarity & Perceptual Hashing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: rgba(22, 25, 41, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #8b5cf6;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 90%, rgba(139, 92, 246, 0.12) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .match-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🖼️</div>
            <div>
                <div class="logo-title">ECHO</div>
                <div class="logo-subtitle">Similarité Visuelle & Hachage Perceptuel (pHash)</div>
            </div>
        </div>
        <div class="badge">PERCEPTUAL HASHING ENGINE ONLINE</div>
    </header>

    <div class="grid">
        <div class="card">
            <div class="card-title">Image Requête & Empreinte</div>
            <div class="info-row"><span class="info-label">Fichier Source</span><span class="info-val" id="queryImg">-</span></div>
            <div class="info-row"><span class="info-label">Empreinte pHash</span><span class="info-val" id="queryHash" style="font-family:monospace; color:#a78bfa;">-</span></div>
        </div>

        <div class="card">
            <div class="card-title">Images Similaires Détectées (Base OSINT)</div>
            <div id="matchesList">Chargement des correspondances...</div>
        </div>
    </div>

    <script>
        async function analyserSimilarite() {
            try {
                const response = await fetch('/api/v1/similar?image_path=photo_investigation.jpg');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('queryImg').textContent = r.query_image || '-';
                document.getElementById('queryHash').textContent = r.query_hash || '-';

                const list = document.getElementById('matchesList');
                list.innerHTML = '';

                (r.matches || []).forEach(m => {
                    list.innerHTML += `
                        <div class="match-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:0.3rem;">
                                <strong style="font-size:0.95rem;">${m.matched_image}</strong>
                                <span style="font-weight:700; color:#a78bfa;">${(m.similarity_score * 100).toFixed(0)}% Similarité</span>
                            </div>
                            <div style="font-size:0.8rem; color:var(--text-muted);">${m.source_url}</div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Erreur lors du calcul de similarité.");
            }
        }

        window.onload = analyserSimilarite;
    </script>
</body>
</html>
